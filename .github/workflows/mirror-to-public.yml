name: Mirror to public repo

# Publishes this (private) repo's tree to the public snapshot mirror
# Rishabh117117/Follow on every push to main. Replaces the old manual
# `git archive | tar -x` refresh. Two safety properties:
#   1. Fail-closed secret scan — gitleaks runs on the exact tree about to be
#      published; ANY finding aborts the job before the push, so a secret
#      accidentally committed to main does NOT auto-leak to the public mirror.
#   2. Inert until configured — if the MIRROR_DEPLOY_KEY secret is absent the
#      job no-ops (green), so merging this workflow does nothing until you
#      deliberately add the key (see .github/workflows/README-mirror.md).
#
# The mirror is snapshot-based (no upstream history) and carries a mirror-only
# `demo/` folder (the portfolio sandbox) that is NOT in this repo — the sync
# preserves it and propagates additions, edits, AND deletions.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: mirror-to-public
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on deploy key
        id: gate
        env:
          KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::MIRROR_DEPLOY_KEY not set — skipping public mirror sync. Add it (see .github/workflows/README-mirror.md) to enable."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Secret scan (blocks publish on any finding)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # --no-git scans the working tree (exactly what we publish), not history.
          ./gitleaks detect --source . --no-git --redact --config .gitleaks.toml --exit-code 1

      - name: Set up SSH (deploy key for the public repo)
        if: steps.gate.outputs.run == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_DEPLOY_KEY }}

      - name: Sync tree into the public mirror
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:Rishabh117117/Follow.git target
          # Wipe everything except the mirror-only demo/ and the .git dir — this
          # is what propagates deletions. Then extract main's current tree.
          find target -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'demo' -exec rm -rf {} +
          git archive HEAD | tar -x -C target
          cd target
          git config user.name "follow-mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to mirror."
          else
            git commit -m "Mirror sync: workspace-platform@${GITHUB_SHA:0:7}"
            git push origin HEAD:main
          fi
