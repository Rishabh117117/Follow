                <span className="bar-count">{formatCostShort(r.cost)}</span>
              </div>
            ))}
          </div>
        </div>
        <div>
          <div className="section-title">By source (month)</div>
          <div className="stat-card" style={{padding: '12px 16px'}}>
            {(local.bySource || []).length === 0 ? (
              <div style={{color: 'var(--text-dim)', fontSize: 11}}>No usage recorded yet</div>
            ) : local.bySource.map(r => (
              <div className="bar-row" key={r.source}>
                <span className="bar-label" style={{width: 140}}>{r.source}</span>
                <div className="bar-track"><div className="bar-fill" style={{width: ((r.cost / maxSource) * 100) + '%', background: 'var(--cyan)'}} /></div>
                <span className="bar-count">{formatCostShort(r.cost)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="section-title" style={{marginTop: 24}}>By model (month)</div>
      <div className="stat-card" style={{padding: '12px 16px', marginBottom: 24}}>
        {(local.byModel || []).length === 0 ? (
          <div style={{color: 'var(--text-dim)', fontSize: 11}}>No usage recorded yet</div>
        ) : local.byModel.map(r => (
          <div className="bar-row" key={r.model}>
            <span className="bar-label" style={{width: 220}}>{r.model}</span>
            <div className="bar-track"><div className="bar-fill" style={{width: ((r.cost / maxModel) * 100) + '%'}} /></div>
            <span className="bar-count">{formatCostShort(r.cost)} · {r.calls}</span>
          </div>
        ))}
      </div>

      <div className="section-title">Recent LLM calls</div>
      <div className="stat-card" style={{padding: 0}}>
        <div className="recent-row" style={{fontWeight: 500, color: 'var(--text)'}}>
          <span>Time</span><span>Model</span><span>Tier</span><span>Source</span><span>Tokens</span><span>Cost</span>
        </div>
        {(local.recent || []).length === 0 ? (
          <div style={{padding: 12, color: 'var(--text-dim)', fontSize: 11}}>No calls recorded yet</div>
        ) : local.recent.map(r => (
          <div className="recent-row" key={r.id}>
            <span>{new Date(r.createdAt).toLocaleTimeString()}</span>
            <span>{r.model}</span>
            <span>{r.modelTier}</span>
            <span style={{color: 'var(--accent)'}}>{r.source}</span>
            <span>{formatTokens(r.inputTokens + r.outputTokens)}</span>
            <span>{formatCostShort(r.costUsd)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Index Tab ───
//
// The Index tab has three views:
//   - 'queue'       : flat job list + global controls (legacy view)
//   - 'sources'     : per-folder aggregate rows + per-folder controls
//   - 'folder:<p>'  : per-file drill-down inside a specific folder
//
// View switching is in-page via React state so back/forward still feel
// responsive and the polling cadence doesn't restart on every navigation.

function useIndexJobs(activeTab, enabled) {
  const [jobs, setJobs] = useState([]);
  const [stats, setStats] = useState(null);
  const [error, setError] = useState(false);
  useEffect(() => {
    if (activeTab !== 'Index' || !enabled) return;
    let mounted = true;
    const poll = async () => {
      try {
        const [jr, sr] = await Promise.all([
          fetch('http://localhost:3001/api/index-queue/jobs'),
          fetch('http://localhost:3001/api/index-queue/stats'),
        ]);
        const jd = await jr.json();
        const sd = await sr.json();
        if (mounted) {
          setJobs(jd.data || []);
          setStats(sd.data || null);
          setError(false);
        }
      } catch { if (mounted) setError(true); }
    };
    poll();
    const id = setInterval(poll, 1000);
    return () => { mounted = false; clearInterval(id); };
  }, [activeTab, enabled]);
  return { jobs, stats, error };
}

function useSources(activeTab, enabled) {
  const [sources, setSources] = useState([]);
  const [stats, setStats] = useState(null);
  const [error, setError] = useState(false);
  useEffect(() => {
    if (activeTab !== 'Index' || !enabled) return;
    let mounted = true;
    const poll = async () => {
      try {
        const [sr, st] = await Promise.all([
          fetch('http://localhost:3001/api/index-queue/sources'),
          fetch('http://localhost:3001/api/index-queue/stats'),
        ]);
        const sd = await sr.json();
        const td = await st.json();
        if (mounted) {
          setSources(sd.data || []);
          setStats(td.data || null);
          setError(false);
        }
      } catch { if (mounted) setError(true); }
    };
    poll();
    const id = setInterval(poll, 1500);
    return () => { mounted = false; clearInterval(id); };
  }, [activeTab, enabled]);
  return { sources, stats, error };
}

function useFolderJobs(activeTab, folderPath) {
  const [jobs, setJobs] = useState([]);
  const [error, setError] = useState(false);
  useEffect(() => {
    if (activeTab !== 'Index' || !folderPath) return;
    let mounted = true;
    const poll = async () => {
      try {
        const res = await fetch(
          'http://localhost:3001/api/index-queue/folder/jobs?folderPath=' + encodeURIComponent(folderPath)
        );
        const body = await res.json();
        if (mounted) { setJobs(body.data || []); setError(false); }
      } catch { if (mounted) setError(true); }
    };
    poll();
    const id = setInterval(poll, 1000);
    return () => { mounted = false; clearInterval(id); };
  }, [activeTab, folderPath]);
  return { jobs, error };
}

function JobCard({ job, onCancel, onOpen }) {
  const p = job.progress || {};
  const pct = p.chunksTotal > 0 ? Math.round((p.chunksDone / p.chunksTotal) * 100) : (p.phase === 'done' ? 100 : 0);
  const fillClass = p.phase === 'done' ? 'done' : p.phase === 'error' ? 'error' : p.phase === 'cancelled' ? 'cancelled' : '';
  const isTerminal = ['completed', 'failed', 'cancelled'].includes(job.status);
  const label = job.label || job.sourceId;
  return (
    <div className="job-card">
      <div className="job-header">
        <span className={dotClass(job.status === 'completed' ? 'ok' : job.status === 'failed' ? 'error' : job.status === 'cancelled' ? 'fallback' : 'ok')} />
        {onOpen ? (
          <span className="job-label" style={{cursor: 'pointer', textDecoration: 'underline dotted'}} onClick={() => onOpen(job)}>{label}</span>
        ) : (
          <span className="job-label">{label}</span>
        )}
        <span className={'phase-pill ' + p.phase}>{p.phase || job.status}</span>
        {!isTerminal && (
          <button className="ghost-btn" onClick={() => onCancel(job.id)}>Cancel</button>
        )}
      </div>
      <div className="job-progress-track">
        <div className={'job-progress-fill ' + fillClass} style={{width: Math.max(pct, 2) + '%'}} />
      </div>
      <div className="job-phase-row">
        <span>{job.type} · attempts {job.attempts}</span>
        <span>
          {p.chunksDone || 0}/{p.chunksTotal || '?'} chunks
          {p.msPerChunk > 0 && ' · ' + Math.round(p.msPerChunk) + 'ms/chunk'}
          {' · ETA ' + formatEta(p.etaMs)}
          {(p.actualCostUsd > 0 || p.estimatedCostUsd > 0) && (
            ' · spent ' + formatCostShort(p.actualCostUsd || 0) +
            (p.estimatedCostUsd > (p.actualCostUsd || 0)
              ? ' / est ' + formatCostShort(p.estimatedCostUsd)
              : '')
          )}
        </span>
      </div>
      {job.filePath && <div style={{fontSize: 10, color: 'var(--text-dim)', marginTop: 4, fontFamily: 'var(--font-mono)'}}>{job.filePath}</div>}
      {p.message && <div style={{fontSize: 10, color: 'var(--text-dim)', marginTop: 4, fontFamily: 'var(--font-mono)'}}>{p.message}</div>}
      {job.lastError && <div style={{fontSize: 10, color: 'var(--red)', marginTop: 4, fontFamily: 'var(--font-mono)'}}>Error: {job.lastError}</div>}
    </div>
  );
}

// ─── Source folder row (Sources view) ───
function SourceRow({ source, busy, onOpen, onAction }) {
  const { folderPath, files, pending, processing, completed, failed, cancelled,
    spentUsd, estimatedRemainingUsd, paused, stopped, snapshotSize } = source;
  const stateLabel = stopped ? 'STOPPED' : paused ? 'PAUSED' : processing > 0 ? 'ACTIVE' : pending > 0 ? 'QUEUED' : 'IDLE';
  const stateColor = stopped ? 'var(--red)' : paused ? 'var(--amber)' : processing > 0 ? 'var(--green)' : 'var(--text-dim)';
  return (
    <div className="job-card" style={{borderLeft: '3px solid ' + stateColor}}>
      <div className="job-header">
        <span className="job-label" style={{cursor: 'pointer', textDecoration: 'underline dotted'}} onClick={() => onOpen(folderPath)}>
          {folderPath}
        </span>
        <span style={{fontFamily: 'var(--font-mono)', fontSize: 10, color: stateColor, letterSpacing: 1}}>{stateLabel}</span>
        {stopped ? (
          <button className="primary-btn" disabled={busy} onClick={() => onAction(folderPath, 'jump-start')}>Jump start</button>
        ) : paused ? (
          <button className="primary-btn" disabled={busy} onClick={() => onAction(folderPath, 'resume')}>Resume</button>
        ) : (
          <button className="ghost-btn" disabled={busy} onClick={() => onAction(folderPath, 'pause')}>Pause</button>
        )}
        {!stopped && (
          <button className="ghost-btn" disabled={busy}
            onClick={() => { if (confirm('Stop this folder and cancel its jobs?\n\n' + folderPath)) onAction(folderPath, 'stop'); }}
            style={{color: 'var(--red)', borderColor: 'rgba(248,113,113,0.4)'}}>Stop</button>
        )}
      </div>
      <div className="job-phase-row">
        <span>
          <strong>{files}</strong> files · {completed} done · {processing} active · {pending} queued
          {failed > 0 && ' · ' + failed + ' failed'}
          {cancelled > 0 && ' · ' + cancelled + ' cancelled'}
          {snapshotSize > 0 && ' · ' + snapshotSize + ' in snapshot'}
        </span>
        <span>
          spent <strong>{formatCostShort(spentUsd)}</strong>
          {estimatedRemainingUsd > 0 && ' · est remaining ' + formatCostShort(estimatedRemainingUsd)}
        </span>
      </div>
    </div>
  );
}

function IndexTab({ activeTab }) {
  // view: 'queue' | 'sources' | 'folder'
  const [view, setView] = useState('sources');
  const [folderPath, setFolderPath] = useState(null);
  const [busy, setBusy] = useState(false);

  const queueEnabled = view === 'queue';
  const sourcesEnabled = view === 'sources';

  const { jobs, stats: jobsStats, error: jobsError } = useIndexJobs(activeTab, queueEnabled);
  const { sources, stats: sourcesStats, error: sourcesError } = useSources(activeTab, sourcesEnabled || view === 'folder');
  const { jobs: folderJobs } = useFolderJobs(activeTab, view === 'folder' ? folderPath : null);

  const stats = jobsStats || sourcesStats;
  const error = (queueEnabled && jobsError) || (sourcesEnabled && sourcesError);

  const cancel = async (id) => {
    try {
      const res = await authedFetch('http://localhost:3001/api/index-queue/jobs/' + id + '/cancel', { method: 'POST' });
      if (!res.ok) { const t = await res.text(); console.warn('cancel failed', t); }
    } catch (e) { console.warn(e); }
  };

  const queueAction = async (action) => {
    setBusy(true);
    try {
      await authedFetch('http://localhost:3001/api/index-queue/' + action, { method: 'POST' });
    } catch (e) { console.warn(action, e); }
    finally { setBusy(false); }
  };

  const folderAction = async (path, action) => {
    setBusy(true);
    try {
      await authedFetch(
        'http://localhost:3001/api/index-queue/folder/' + action,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ folderPath: path }),
        }
      );
    } catch (e) { console.warn('folder', action, e); }
    finally { setBusy(false); }
  };

  if (error) return <div className="error-banner"><span className="dot dot-red" /> Failed to load index queue.</div>;

  const paused = stats?.paused;
  const stopped = stats?.stopped;
  const snapshotSize = stats?.stoppedSnapshotSize ?? 0;
  const throughput = stats?.throughputJobsPerSec ?? 0;
  const enqueueRate = (stats?.enqueuedLastMin ?? 0) / 60;
  const netDrain = throughput - enqueueRate;
  const remaining = (stats?.pending ?? 0) + (stats?.processing ?? 0);
  let etaLabel = '—';
  if (remaining === 0) etaLabel = 'idle';
  else if (throughput > 0) {
    const rate = netDrain > 0.01 ? netDrain : throughput;
    const sec = remaining / rate;
    etaLabel = formatEta(sec * 1000) + (netDrain <= 0.01 && enqueueRate > throughput ? ' (still uploading)' : '');
  } else if (stats?.processing > 0) {
    etaLabel = 'measuring…';
  }

  const barBg = stopped ? 'rgba(248,113,113,0.10)' : paused ? 'rgba(251,191,36,0.12)' : 'rgba(108,99,255,0.06)';
  const barBorder = stopped ? 'var(--red)' : paused ? 'var(--amber)' : 'var(--accent)';
  const stateLabel = stopped ? '⏹ Queue STOPPED' : paused ? '⏸ Queue paused' : '▶ Queue running';

  // Sub-view navigation (queue / sources / active folder)
  const SubTab = ({ id, label }) => (
    <button className={'tab-btn' + (view === id ? ' active' : '')}
      onClick={() => { setView(id); if (id !== 'folder') setFolderPath(null); }}>
      {label}
    </button>
  );

  return (
    <div>
      <div className="save-bar" style={{background: barBg, borderColor: barBorder}}>
        <span style={{flex: 1, fontFamily: 'var(--font-mono)', fontSize: 12}}>
          {stateLabel} ·{' '}
          throughput <strong>{throughput.toFixed(2)}/s</strong> · enqueue <strong>{enqueueRate.toFixed(2)}/s</strong> · ETA <strong>{etaLabel}</strong>
          {' · spent '} <strong>{formatCostShort(stats?.spentUsd ?? 0)}</strong>
          {stats?.estimatedRemainingUsd > 0 && ' · est remaining ' + formatCostShort(stats.estimatedRemainingUsd)}
          {snapshotSize > 0 && stopped && ' · ' + snapshotSize + ' held in snapshot'}
        </span>
        {stopped ? (
          <button className="primary-btn" onClick={() => queueAction('jump-start')} disabled={busy}>Jump start</button>
        ) : paused ? (
          <button className="primary-btn" onClick={() => queueAction('resume')} disabled={busy}>Resume</button>
        ) : (
          <button className="ghost-btn" onClick={() => queueAction('pause')} disabled={busy}>Pause</button>
        )}
        {!stopped && (
          <button className="ghost-btn"
            onClick={() => { if (confirm('Stop and cancel ALL jobs?\n\nPending sources will be snapshotted. Use "Jump start" to resume them.')) queueAction('stop'); }}
            disabled={busy} style={{color: 'var(--red)', borderColor: 'rgba(248,113,113,0.4)'}}>Stop all</button>
        )}
      </div>

      <div className="tab-bar" style={{paddingLeft: 0, marginTop: 12, marginBottom: 8, borderBottom: '1px solid var(--border)'}}>
        <SubTab id="sources" label={'Sources' + (sources.length ? ' (' + sources.length + ')' : '')} />
        <SubTab id="queue" label="Queue" />
        {view === 'folder' && <SubTab id="folder" label={'Folder: ' + (folderPath || '')} />}
      </div>

      <div className="stat-grid stat-grid-5">
        <StatCard label="Processing" value={stats?.processing ?? 0} sub={paused ? 'PAUSED' : (stats?.processing > 0 ? 'In flight' : 'idle')} />
        <StatCard label="Pending" value={stats?.pending ?? 0} sub={netDrain > 0 ? 'catching up' : enqueueRate > 0 ? 'falling behind' : ''} />
        <StatCard label="Done (last 5min)" value={stats?.completedLast5Min ?? 0} sub={'avg ' + formatEta(stats?.medianJobDurationMs ?? 0) + ' / job'} />
        <StatCard label="Failed" value={stats?.failed ?? 0} />
        <StatCard label="Cancelled" value={stats?.cancelled ?? 0} />
      </div>

      {view === 'sources' && (
        <div>
          <div className="section-title">Sources — grouped by folder</div>
          {sources.length === 0 ? (
            <div className="stat-card" style={{padding: '20px 16px', color: 'var(--text-dim)', fontSize: 12, textAlign: 'center'}}>
              No sources yet. Upload a file or watch a folder to start indexing.
            </div>
          ) : sources.map(s => (
            <SourceRow key={s.folderPath} source={s} busy={busy}
              onOpen={(p) => { setFolderPath(p); setView('folder'); }}
              onAction={folderAction} />
          ))}
        </div>
      )}

      {view === 'queue' && (
        <div>
          <div className="section-title">Jobs</div>
          {jobs.length === 0 ? (
            <div className="stat-card" style={{padding: '20px 16px', color: 'var(--text-dim)', fontSize: 12, textAlign: 'center'}}>
              No jobs in queue. Upload a file to start indexing.
            </div>
          ) : jobs.map(j => <JobCard key={j.id} job={j} onCancel={cancel} />)}
        </div>
      )}

      {view === 'folder' && folderPath && (
        <FolderDetail
          folderPath={folderPath}
          jobs={folderJobs}
          source={sources.find(s => s.folderPath === folderPath)}
          busy={busy}
          onBack={() => { setView('sources'); setFolderPath(null); }}
          onCancel={cancel}
          onAction={folderAction}
        />
      )}
    </div>
  );
}

function FolderDetail({ folderPath, jobs, source, busy, onBack, onCancel, onAction }) {
  const paused = source?.paused;
  const stopped = source?.stopped;
  return (
    <div>
      <div className="section-title" style={{display: 'flex', alignItems: 'center', gap: 12, marginTop: 12}}>
        <button className="ghost-btn" onClick={onBack}>&larr; Sources</button>
        <span style={{fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text)'}}>{folderPath}</span>
        {source && (
          <span style={{marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-dim)'}}>
            {source.files} files · spent <strong style={{color: 'var(--text)'}}>{formatCostShort(source.spentUsd)}</strong>
            {source.estimatedRemainingUsd > 0 && ' · est remaining ' + formatCostShort(source.estimatedRemainingUsd)}
          </span>
        )}
      </div>
      <div className="save-bar" style={{marginTop: 0, background: stopped ? 'rgba(248,113,113,0.10)' : paused ? 'rgba(251,191,36,0.12)' : 'rgba(108,99,255,0.06)', borderColor: stopped ? 'var(--red)' : paused ? 'var(--amber)' : 'var(--accent)'}}>
        <span style={{flex: 1, fontFamily: 'var(--font-mono)', fontSize: 11}}>
          {stopped ? 'Folder stopped — ' + (source?.snapshotSize ?? 0) + ' sources in snapshot'
            : paused ? 'Folder paused — in-flight jobs still draining'
            : 'Folder live — ' + (source?.processing ?? 0) + ' active / ' + (source?.pending ?? 0) + ' queued'}
        </span>
        {stopped ? (
          <button className="primary-btn" disabled={busy} onClick={() => onAction(folderPath, 'jump-start')}>Jump start</button>
        ) : paused ? (
          <button className="primary-btn" disabled={busy} onClick={() => onAction(folderPath, 'resume')}>Resume</button>
        ) : (
          <button className="ghost-btn" disabled={busy} onClick={() => onAction(folderPath, 'pause')}>Pause folder</button>
        )}
        {!stopped && (
          <button className="ghost-btn" disabled={busy}
            onClick={() => { if (confirm('Stop this folder?\n\n' + folderPath)) onAction(folderPath, 'stop'); }}
            style={{color: 'var(--red)', borderColor: 'rgba(248,113,113,0.4)'}}>Stop folder</button>
        )}
      </div>
      <div className="section-title">Files</div>
      {jobs.length === 0 ? (
        <div className="stat-card" style={{padding: '20px 16px', color: 'var(--text-dim)', fontSize: 12, textAlign: 'center'}}>
          No active files in this folder.
        </div>
      ) : jobs.map(j => <JobCard key={j.id} job={j} onCancel={onCancel} />)}
    </div>
  );
}

// ─── Graph Tab (nodes/edges/weights spreadsheet) ───
function fmtNum(n, dp) {
  if (n === null || n === undefined) return '—';
  const v = Number(n);
  if (Number.isNaN(v)) return '—';
  return dp ? v.toFixed(dp) : v.toLocaleString();
}
function fmtTime(s) {
  if (!s) return '—';
  try { return new Date(s).toLocaleString(); } catch { return s; }
}

function GraphTab({ initialFilter, initialView }) {
  const [view, setView] = useState(initialView || 'summary'); // summary | nodes | edges
  const [summary, setSummary] = useState([]);
  const [nodes, setNodes] = useState([]);
  const [edges, setEdges] = useState([]);
  const [filter, setFilter] = useState(initialFilter || { userId: '', spaceId: '', workspaceId: '' });
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  // When App passes a fresh initialFilter (user clicked "View graph" on a row),
  // adopt it so the Graph tab opens scoped to that user/index.
  useEffect(() => {
    if (initialFilter) setFilter(initialFilter);
    if (initialView)   setView(initialView);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [initialFilter, initialView]);

  const qs = React.useMemo(() => {
    const p = new URLSearchParams();
    if (filter.userId) p.set('userId', filter.userId);
    if (filter.spaceId) p.set('spaceId', filter.spaceId);
    if (filter.workspaceId) p.set('workspaceId', filter.workspaceId);
    return p.toString();
  }, [filter]);

  const load = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const url = view === 'summary'
        ? 'http://localhost:3001/api/dev/graph/summary'
        : 'http://localhost:3001/api/dev/graph/' + view + (qs ? '?' + qs : '');
      const res = await authedFetch(url);
      const json = await res.json();
      if (json.error) { setError(json.error.message); return; }
      if (view === 'summary') setSummary(json.data || []);
      else if (view === 'nodes') setNodes(json.data || []);
      else setEdges(json.data || []);
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  }, [view, qs]);

  useEffect(() => { load(); }, [load]);

  const SubTab = ({ id, label, count }) => (
    <button className={'tab-btn' + (view === id ? ' active' : '')} onClick={() => setView(id)}>
      {label}{count !== undefined ? ' (' + count + ')' : ''}
    </button>
  );

  const drillTo = (target, row) => {
    const next = { ...filter };
    if (row.userId) next.userId = row.userId;
    if (row.spaceId) next.spaceId = row.spaceId;
    if (row.workspaceId) next.workspaceId = row.workspaceId;
    setFilter(next);
    setView(target);
  };

  return (
    <div>
      <div style={{display:'flex', gap:8, alignItems:'center', marginBottom:12}}>
        <div className="tab-bar" style={{borderBottom:'none', marginBottom:0}}>
          <SubTab id="summary" label="Summary" count={summary.length || undefined} />
          <SubTab id="nodes"   label="Nodes" />
          <SubTab id="edges"   label="Edges" />
        </div>
        <div style={{flex:1}} />
        {(filter.userId || filter.spaceId || filter.workspaceId) && (
          <button className="ghost-btn" onClick={() => setFilter({userId:'', spaceId:'', workspaceId:''})}>
            Clear filters
          </button>
        )}
        <button className="ghost-btn" onClick={load} disabled={loading}>{loading ? 'Loading…' : 'Refresh'}</button>
      </div>

      {(filter.userId || filter.spaceId || filter.workspaceId) && (
        <div style={{fontSize:11, fontFamily:'var(--font-mono)', color:'var(--text-dim)', marginBottom:8}}>
          Filtered by:
          {filter.userId && <span style={{marginLeft:8}}>user={filter.userId.slice(0,8)}</span>}
          {filter.spaceId && <span style={{marginLeft:8}}>space={filter.spaceId.slice(0,8)}</span>}
          {filter.workspaceId && <span style={{marginLeft:8}}>workspace={filter.workspaceId.slice(0,8)}</span>}
        </div>
      )}

      {error && <div className="error-banner"><span className="dot dot-red" /> {error}</div>}

      {view === 'summary' && (
        <div className="stat-card" style={{padding:0, overflow:'auto'}}>
          <table style={{width:'100%', borderCollapse:'collapse', fontSize:11, fontFamily:'var(--font-mono)'}}>
            <thead style={{background:'rgba(255,255,255,0.04)'}}>
              <tr style={{textAlign:'left', color:'var(--text-dim)'}}>
                <th style={{padding:'8px 12px'}}>User</th>
                <th style={{padding:'8px 12px'}}>Index (Space)</th>
                <th style={{padding:'8px 12px', textAlign:'right'}}>Nodes</th>
                <th style={{padding:'8px 12px', textAlign:'right'}}>Edges</th>
                <th style={{padding:'8px 12px', textAlign:'right'}}>Avg sim</th>
                <th style={{padding:'8px 12px', textAlign:'right'}}>Cross-user</th>
                <th style={{padding:'8px 12px', textAlign:'right'}}>Key Δ</th>
                <th style={{padding:'8px 12px', textAlign:'right'}}>Avg engag.</th>
                <th style={{padding:'8px 12px'}}>Last indexed</th>
              </tr>
            </thead>
            <tbody>
              {summary.length === 0 && (
                <tr><td colSpan={9} style={{padding:'16px 12px', color:'var(--text-dim)', textAlign:'center'}}>
                  {loading ? 'Loading…' : 'No index records yet.'}
                </td></tr>
              )}
              {summary.map((r, i) => (
                <tr key={i} style={{borderTop:'1px solid var(--border)', cursor:'pointer'}}
                    onClick={() => drillTo('nodes', r)}>
                  <td style={{padding:'8px 12px'}}>
                    <div style={{color:'#fff'}}>{r.userName || '—'}</div>
                    <div style={{color:'var(--text-dim)', fontSize:10}}>{r.userEmail}</div>
                  </td>
                  <td style={{padding:'8px 12px'}}>{r.spaceName}</td>
                  <td style={{padding:'8px 12px', textAlign:'right'}}>{fmtNum(r.nodeCount)}</td>
                  <td style={{padding:'8px 12px', textAlign:'right'}}>{fmtNum(r.edgeCount)}</td>
                  <td style={{padding:'8px 12px', textAlign:'right'}}>{fmtNum(r.avgSimilarity, 3)}</td>
                  <td style={{padding:'8px 12px', textAlign:'right'}}>{fmtNum(r.crossUserEdges)}</td>
                  <td style={{padding:'8px 12px', textAlign:'right'}}>{fmtNum(r.keyChangeCount)}</td>
                  <td style={{padding:'8px 12px', textAlign:'right'}}>{fmtNum(r.avgEngagement, 2)}</td>
                  <td style={{padding:'8px 12px'}}>{fmtTime(r.lastIndexedAt)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {view === 'nodes' && (
        <div className="stat-card" style={{padding:0, overflow:'auto', maxHeight: '70vh'}}>
          <table style={{width:'100%', borderCollapse:'collapse', fontSize:10, fontFamily:'var(--font-mono)'}}>
            <thead style={{background:'rgba(255,255,255,0.04)', position:'sticky', top:0}}>
              <tr style={{textAlign:'left', color:'var(--text-dim)'}}>
                <th style={{padding:'6px 10px'}}>Indexed</th>
                <th style={{padding:'6px 10px'}}>User</th>
                <th style={{padding:'6px 10px'}}>Doc / Section</th>
                <th style={{padding:'6px 10px'}}>Magn.</th>
                <th style={{padding:'6px 10px'}}>Type</th>
                <th style={{padding:'6px 10px', textAlign:'right'}}>Engag.</th>
                <th style={{padding:'6px 10px', textAlign:'right'}}>In</th>
                <th style={{padding:'6px 10px', textAlign:'right'}}>Out</th>
                <th style={{padding:'6px 10px'}}>Flags</th>
                <th style={{padding:'6px 10px'}}>Embedding text</th>
              </tr>
            </thead>
            <tbody>
              {nodes.length === 0 && (
                <tr><td colSpan={10} style={{padding:'16px 12px', color:'var(--text-dim)', textAlign:'center'}}>
                  {loading ? 'Loading…' : 'No nodes match the current filter.'}
                </td></tr>
              )}
              {nodes.map(n => (
                <tr key={n.id} style={{borderTop:'1px solid var(--border)'}}>
                  <td style={{padding:'6px 10px', whiteSpace:'nowrap', color:'var(--text-dim)'}}>{fmtTime(n.indexedAt)}</td>
                  <td style={{padding:'6px 10px'}}>{n.userName || (n.userId ? n.userId.slice(0,8) : '—')}</td>
                  <td style={{padding:'6px 10px'}}>
                    <div style={{color:'#fff'}}>{n.documentTitle || '—'}</div>
                    {n.sectionAlias && <div style={{color:'var(--text-dim)', fontSize:9}}>§ {n.sectionAlias}</div>}
                  </td>
                  <td style={{padding:'6px 10px'}}>{n.magnitude}</td>
                  <td style={{padding:'6px 10px'}}>{n.threadType}</td>
                  <td style={{padding:'6px 10px', textAlign:'right'}}>{fmtNum(n.engagementDepth, 2)}</td>
                  <td style={{padding:'6px 10px', textAlign:'right'}}>{n.inEdges}</td>
                  <td style={{padding:'6px 10px', textAlign:'right'}}>{n.outEdges}</td>
                  <td style={{padding:'6px 10px'}}>
                    {n.isKeyChange && <span style={{color:'var(--amber)', marginRight:4}}>KEY</span>}
                    {n.isAIInvolved && <span style={{color:'var(--accent)', marginRight:4}}>AI</span>}
                    {n.hasEvidence && <span style={{color:'var(--green)'}}>EV</span>}
                  </td>
                  <td style={{padding:'6px 10px', maxWidth:380, color:'var(--text-dim)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                      title={n.embeddingText}>
                    {n.embeddingText}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {view === 'edges' && (
        <div className="stat-card" style={{padding:0, overflow:'auto', maxHeight: '70vh'}}>
          <table style={{width:'100%', borderCollapse:'collapse', fontSize:10, fontFamily:'var(--font-mono)'}}>
            <thead style={{background:'rgba(255,255,255,0.04)', position:'sticky', top:0}}>
              <tr style={{textAlign:'left', color:'var(--text-dim)'}}>
                <th style={{padding:'6px 10px', textAlign:'right'}}>Weight</th>
                <th style={{padding:'6px 10px'}}>Type</th>
                <th style={{padding:'6px 10px'}}>Source (user · doc · text)</th>
                <th style={{padding:'6px 10px'}}>Target (user · doc · text)</th>
                <th style={{padding:'6px 10px'}}>Reason</th>
                <th style={{padding:'6px 10px'}}>Created</th>
              </tr>
            </thead>
            <tbody>
              {edges.length === 0 && (
                <tr><td colSpan={6} style={{padding:'16px 12px', color:'var(--text-dim)', textAlign:'center'}}>
                  {loading ? 'Loading…' : 'No edges match the current filter.'}
                </td></tr>
              )}
              {edges.map(e => (
                <tr key={e.id} style={{borderTop:'1px solid var(--border)'}}>
                  <td style={{padding:'6px 10px', textAlign:'right', color:e.similarity > 0.8 ? 'var(--green)' : '#fff'}}>
                    {fmtNum(e.similarity, 3)}
                  </td>
                  <td style={{padding:'6px 10px'}}>
                    {e.linkType}
                    {e.crossUser && <span style={{color:'var(--accent)', marginLeft:4}}>×U</span>}
                  </td>
                  <td style={{padding:'6px 10px', maxWidth:340}}>
                    <div style={{color:'#fff'}}>{e.source.userName || '—'} · {e.source.doc || '—'}</div>
                    <div style={{color:'var(--text-dim)', fontSize:9, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                         title={e.source.text}>{e.source.text}</div>
                  </td>
                  <td style={{padding:'6px 10px', maxWidth:340}}>
                    <div style={{color:'#fff'}}>{e.target.userName || '—'} · {e.target.doc || '—'}</div>
                    <div style={{color:'var(--text-dim)', fontSize:9, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                         title={e.target.text}>{e.target.text}</div>
                  </td>
                  <td style={{padding:'6px 10px', color:'var(--text-dim)'}}>{e.reason || '—'}</td>
                  <td style={{padding:'6px 10px', whiteSpace:'nowrap', color:'var(--text-dim)'}}>{fmtTime(e.createdAt)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── Main App ───
const TABS = ['Overview', 'MCP', 'Pipeline', 'Index', 'Graph', 'Models', 'Usage', 'Users', 'System', 'Traffic', 'Logs'];

function App() {
  const [activeTab, setActiveTab] = useState('Overview');
  // Cross-tab launch: a child (Users / Summary row) can call openGraph(filter, view)
  // to switch to the Graph tab pre-scoped. Bumping `pendingGraphNonce` forces the
  // GraphTab effect to re-apply the filter even when the same user is selected
  // twice in a row.
  const [graphLaunch, setGraphLaunch] = useState({ filter: null, view: null, nonce: 0 });
  const openGraph = useCallback((filter, view) => {
    setGraphLaunch((prev) => ({ filter, view: view || 'summary', nonce: prev.nonce + 1 }));
    setActiveTab('Graph');
  }, []);
  const { data, error } = useHealthData();

  const allOk = data && data.status === 'healthy';

  return (
    <div className="console-shell">
      <div className="console-header">
        <span className="brand">Follow</span>
        <span className="badge">DEV CONSOLE</span>
        <div className="status-pill">
          <span className={allOk ? 'dot dot-green dot-pulse' : error ? 'dot dot-red' : 'dot dot-amber'} />
          {error ? 'Connection error' : allOk ? 'All systems operational' : data ? 'Degraded' : 'Connecting...'}
        </div>
        <span className="host">localhost:4000</span>
      </div>

      <div className="tab-bar">
        {TABS.map(tab => (
          <button key={tab} className={'tab-btn' + (activeTab === tab ? ' active' : '')} onClick={() => setActiveTab(tab)}>
            {tab}
          </button>
        ))}
      </div>

      <div className="tab-content">
        {error && <div className="error-banner"><span className="dot dot-red" /> Unable to connect to API at localhost:3001. Is the server running?</div>}
        {activeTab === 'Overview' && <OverviewTab data={data} />}
        {activeTab === 'MCP' && <MCPTab data={data} />}
        {activeTab === 'Pipeline' && <PipelineTab data={data} />}
        {activeTab === 'Index' && <IndexTab activeTab={activeTab} />}
        {activeTab === 'Graph' && (
          <GraphTab
            key={graphLaunch.nonce}
            initialFilter={graphLaunch.filter}
            initialView={graphLaunch.view}
          />
        )}
        {activeTab === 'Models' && <ModelsTab />}
        {activeTab === 'Usage' && <UsageTab />}
        {activeTab === 'Users' && <UsersTab openGraph={openGraph} />}
        {activeTab === 'System' && <SystemTab data={data} />}
        {activeTab === 'Traffic' && <TrafficTab />}
        {activeTab === 'Logs' && <LogsTab />}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
