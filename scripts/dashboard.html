<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow Dev Console</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #07080c;
  --card: #0d0f15;
  --border: #1a1d28;
  --text: #c8ccd8;
  --text-dim: #6b7085;
  --accent: #6C63FF;
  --green: #34d399;
  --amber: #fbbf24;
  --red: #f87171;
  --cyan: #22d3ee;
  --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', 'JetBrains Mono', monospace;
}
body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; }
.console-shell { display: flex; flex-direction: column; height: 100vh; }
.console-header {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 24px; border-bottom: 1px solid var(--border);
  background: var(--card); flex-shrink: 0;
}
.console-header .brand { font-size: 18px; font-weight: 600; color: var(--accent); letter-spacing: -0.5px; }
.console-header .badge {
  font-family: var(--font-mono); font-size: 9px; font-weight: 500;
  letter-spacing: 1.5px; background: var(--accent); color: #fff;
  padding: 3px 8px; border-radius: 3px;
}
.console-header .status-pill {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--green); margin-left: auto;
}
.console-header .host {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot-green { background: var(--green); box-shadow: 0 0 6px rgba(52,211,153,0.4); }
.dot-amber { background: var(--amber); box-shadow: 0 0 6px rgba(251,191,36,0.4); }
.dot-red { background: var(--red); box-shadow: 0 0 6px rgba(248,113,113,0.4); }
.dot-gray { background: #3a3f52; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.dot-pulse { animation: pulse 2s ease-in-out infinite; }

.tab-bar {
  display: flex; gap: 0; border-bottom: 1px solid var(--border);
  background: var(--card); padding: 0 24px; flex-shrink: 0;
}
.tab-btn {
  font-family: var(--font-mono); font-size: 11px; font-weight: 400;
  color: var(--text-dim); background: none; border: none;
  padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

.tab-content { flex: 1; overflow-y: auto; padding: 24px; }

/* Cards & grids */
.stat-grid { display: grid; gap: 12px; margin-bottom: 24px; }
.stat-grid-5 { grid-template-columns: repeat(5, 1fr); }
.stat-grid-4 { grid-template-columns: repeat(4, 1fr); }
.stat-grid-3 { grid-template-columns: repeat(3, 1fr); }
.stat-grid-2 { grid-template-columns: repeat(2, 1fr); }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px;
}
.stat-card .label { font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: 1.2px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
.stat-card .value { font-size: 24px; font-weight: 600; color: #fff; }
.stat-card .sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

.section-title {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase;
  margin-bottom: 12px; margin-top: 8px;
}

.service-table {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; margin-bottom: 24px;
}
.service-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.service-row:last-child { border-bottom: none; }
.service-row .name { width: 120px; font-weight: 500; }
.service-row .status-label { font-family: var(--font-mono); font-size: 11px; }
.service-row .detail { flex: 1; color: var(--text-dim); font-size: 11px; }
.service-row .port-badge {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
  background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 3px;
}

/* MCP tools */
.tool-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  font-size: 12px; cursor: pointer;
}
.tool-row:hover { background: rgba(255,255,255,0.02); }
.tool-row .tool-name { font-family: var(--font-mono); font-weight: 500; width: 180px; }
.tool-row .tool-stat { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
.tool-expanded { padding: 8px 16px 16px 38px; font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--border); background: rgba(108,99,255,0.03); }
.error-badge { font-family: var(--font-mono); font-size: 9px; background: rgba(248,113,113,0.15); color: var(--red); padding: 1px 6px; border-radius: 3px; }

/* Endpoint rows */
.endpoint-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.endpoint-row .ep-label { width: 100px; font-weight: 500; color: var(--text-dim); }
.endpoint-row .ep-url { font-family: var(--font-mono); color: var(--accent); flex: 1; word-break: break-all; }
.copy-btn {
  font-family: var(--font-mono); font-size: 9px; background: rgba(255,255,255,0.06);
  border: 1px solid var(--border); color: var(--text-dim); padding: 3px 10px;
  border-radius: 4px; cursor: pointer;
}
.copy-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

/* Pipeline */
.pipeline-flow { display: flex; align-items: center; gap: 0; margin-bottom: 24px; flex-wrap: wrap; }
.pipeline-stage {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 18px; min-width: 120px; text-align: center;
}
.pipeline-stage .stage-name { font-family: var(--font-mono); font-size: 11px; font-weight: 500; margin-bottom: 4px; }
.pipeline-stage .stage-status { font-size: 10px; color: var(--text-dim); }
.pipeline-arrow { font-size: 16px; color: var(--text-dim); padding: 0 6px; }

/* Bar chart rows */
.bar-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.bar-label { width: 120px; font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
.bar-count { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); width: 50px; text-align: right; }

/* Users table */
.users-table { width: 100%; border-collapse: collapse; }
.users-table th {
  font-family: var(--font-mono); font-size: 9px; font-weight: 500;
  letter-spacing: 1px; color: var(--text-dim); text-transform: uppercase;
  text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border);
}
.users-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
.users-table tr:hover { background: rgba(255,255,255,0.02); cursor: pointer; }
.user-cell { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
.app-pill {
  font-family: var(--font-mono); font-size: 9px; padding: 2px 8px;
  border-radius: 10px; display: inline-block; margin-right: 4px;
}

/* Logs */
.log-viewer {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; font-family: var(--font-mono); font-size: 10px;
  line-height: 1.7; min-height: 300px; max-height: 500px; overflow-y: auto;
  color: var(--text-dim);
}
.log-line-success { color: var(--green); }
.log-line-error { color: var(--red); }
.log-line-warn { color: var(--amber); }

/* Traffic table */
.traffic-table { width: 100%; border-collapse: collapse; }
.traffic-table th {
  font-family: var(--font-mono); font-size: 9px; font-weight: 500;
  letter-spacing: 1px; color: var(--text-dim); text-transform: uppercase;
  text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border);
}
.traffic-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 11px; font-family: var(--font-mono); }

/* Sub-tabs */
.sub-tabs { display: flex; gap: 2px; margin-bottom: 12px; }
.sub-tab {
  font-family: var(--font-mono); font-size: 10px; background: rgba(255,255,255,0.04);
  border: 1px solid var(--border); color: var(--text-dim);
  padding: 6px 14px; border-radius: 4px; cursor: pointer;
}
.sub-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Connection error banner */
.error-banner {
  background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
  color: var(--red); padding: 10px 16px; border-radius: 6px; margin-bottom: 16px;
  font-size: 12px; display: flex; align-items: center; gap: 8px;
}

/* Cost model bars */
.cost-bar-label { width: 170px; }

/* Resource cards */
.resource-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px;
}
.resource-card .res-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.resource-card .res-name { font-weight: 500; font-size: 12px; }
.res-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 10px; }
.res-bar-label { width: 50px; color: var(--text-dim); font-family: var(--font-mono); }
.res-bar-track { flex: 1; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
.res-bar-fill { height: 100%; border-radius: 2px; }
.res-bar-value { width: 40px; text-align: right; font-family: var(--font-mono); color: var(--text-dim); }

/* Drilldown */
.back-btn {
  font-family: var(--font-mono); font-size: 11px; color: var(--accent);
  background: none; border: none; cursor: pointer; margin-bottom: 16px;
  padding: 0;
}
.back-btn:hover { text-decoration: underline; }
.profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.profile-header .avatar-lg {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 600;
}

/* Models tab */
.tier-row {
  display: grid; grid-template-columns: 200px 1fr 130px 120px 80px;
  gap: 12px; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.tier-row:last-child { border-bottom: none; }
.tier-row .tier-name { font-family: var(--font-mono); font-weight: 500; }
.tier-row .tier-default { font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); }
.tier-row .tier-selector {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 6px 8px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 11px; width: 100%;
}
.tier-row .tier-selector:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.tier-row .tier-usage { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-align: right; }
.tier-row .overridden-pill {
  font-family: var(--font-mono); font-size: 9px;
  background: rgba(108,99,255,0.15); color: var(--accent);
  padding: 2px 6px; border-radius: 3px;
}
.save-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: rgba(108,99,255,0.06);
  border: 1px solid var(--accent); border-radius: 8px;
  margin-bottom: 16px;
}
.primary-btn {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  background: var(--accent); color: #fff; border: none;
  padding: 8px 16px; border-radius: 4px; cursor: pointer;
}
.primary-btn:hover { opacity: 0.9; }
.primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ghost-btn {
  font-family: var(--font-mono); font-size: 11px;
  background: rgba(255,255,255,0.05); color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 4px; cursor: pointer;
}
.ghost-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

/* Index jobs */
.job-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 10px;
}
.job-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.job-label { font-weight: 500; font-size: 13px; flex: 1; }
.job-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
.job-progress-track {
  height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden;
  margin: 6px 0;
}
.job-progress-fill {
  height: 100%; background: var(--accent); border-radius: 4px;
  transition: width 0.3s ease;
}
.job-progress-fill.done { background: var(--green); }
.job-progress-fill.error { background: var(--red); }
.job-progress-fill.cancelled { background: var(--text-dim); }
.job-phase-row {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
  margin-top: 4px;
}
.phase-pill {
  font-family: var(--font-mono); font-size: 9px; padding: 2px 8px;
  border-radius: 10px; text-transform: uppercase; letter-spacing: 1px;
}
.phase-pill.queued { background: rgba(255,255,255,0.06); color: var(--text-dim); }
.phase-pill.chunking, .phase-pill.enriching, .phase-pill.embedding, .phase-pill.storing {
  background: rgba(108,99,255,0.15); color: var(--accent);
}
.phase-pill.done { background: rgba(52,211,153,0.15); color: var(--green); }
.phase-pill.error { background: rgba(248,113,113,0.15); color: var(--red); }
.phase-pill.cancelled { background: rgba(107,112,133,0.2); color: var(--text-dim); }

/* Usage panels */
.credit-hero {
  background: linear-gradient(135deg, rgba(108,99,255,0.12), rgba(34,211,238,0.06));
  border: 1px solid rgba(108,99,255,0.3);
  border-radius: 10px; padding: 20px 24px; margin-bottom: 16px;
}
.credit-hero .hero-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px;
  color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px;
}
.credit-hero .hero-value { font-size: 28px; font-weight: 600; color: #fff; }
.credit-hero .hero-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; font-family: var(--font-mono); }

.sparkline { display: flex; align-items: flex-end; gap: 2px; height: 40px; margin: 6px 0; }
.spark-bar { flex: 1; background: var(--accent); opacity: 0.7; border-radius: 2px 2px 0 0; min-height: 1px; }
.spark-bar:hover { opacity: 1; }

.recent-row {
  display: grid; grid-template-columns: 80px 160px 100px 100px 80px 80px;
  gap: 10px; align-items: center;
  padding: 6px 12px; border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
}
.recent-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── Data fetching ───
function useHealthData() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(false);

  useEffect(() => {
    let mounted = true;
    const poll = async () => {
      try {
        const res = await fetch('http://localhost:3001/api/health');
        // Accept 200 (healthy) AND 503 (degraded but responding — fallback modes)
        if (res.status !== 200 && res.status !== 503) {
          throw new Error('HTTP ' + res.status);
        }
        const json = await res.json();
        if (mounted) { setData(json); setError(false); }
      } catch {
        if (mounted) setError(true);
      }
    };
    poll();
    const id = setInterval(poll, 3000);
    return () => { mounted = false; clearInterval(id); };
  }, []);

  return { data, error };
}

function useUsersStats() {
  const [users, setUsers] = useState([]);
  const [error, setError] = useState(false);

  useEffect(() => {
    let mounted = true;
    const poll = async () => {
      try {
        const res = await authedFetch('http://localhost:3001/api/users/stats');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        if (mounted) { setUsers(Array.isArray(json?.data) ? json.data : []); setError(false); }
      } catch {
        if (mounted) setError(true);
      }
    };
    poll();
    const id = setInterval(poll, 5000);
    return () => { mounted = false; clearInterval(id); };
  }, []);

  return { users, error };
}

function useLauncherStatus() {
  const [launcher, setLauncher] = useState(null);

  useEffect(() => {
    let mounted = true;
    const poll = async () => {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) return;
        const json = await res.json();
        if (mounted) setLauncher(json);
      } catch {
        // non-fatal
      }
    };
    poll();
    const id = setInterval(poll, 3000);
    return () => { mounted = false; clearInterval(id); };
  }, []);

  return launcher;
}

// ─── Utilities ───
function statusColor(status) {
  if (status === 'ok' || status === 'running' || status === 'healthy') return 'var(--green)';
  if (status === 'fallback' || status === 'degraded') return 'var(--amber)';
  if (status === 'error') return 'var(--red)';
  return 'var(--text-dim)';
}
function dotClass(status) {
  if (status === 'ok' || status === 'running' || status === 'healthy') return 'dot dot-green dot-pulse';
  if (status === 'fallback' || status === 'degraded') return 'dot dot-amber';
  if (status === 'error') return 'dot dot-red';
  return 'dot dot-gray';
}
function statusText(status) {
  if (status === 'ok' || status === 'running') return 'Running';
  if (status === 'fallback') return 'Fallback';
  if (status === 'error') return 'Error';
  return 'Unknown';
}
function copyToClipboard(text) {
  navigator.clipboard.writeText(text);
}
function formatUptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// ─── Stat Card ───
function StatCard({ label, value, sub }) {
  return (
    <div className="stat-card">
      <div className="label">{label}</div>
      <div className="value">{value}</div>
      {sub && <div className="sub">{sub}</div>}
    </div>
  );
}

// ─── Service Row ───
function ServiceRow({ dotStatus, name, statusLabel, detail, port }) {
  return (
    <div className="service-row">
      <span className={dotClass(dotStatus)} />
      <span className="name">{name}</span>
      <span className="status-label" style={{ color: statusColor(dotStatus) }}>{statusLabel}</span>
      <span className="detail">{detail}</span>
      {port && <span className="port-badge">:{port}</span>}
    </div>
  );
}

// ─── Overview Tab ───
function OverviewTab({ data }) {
  const launcher = useLauncherStatus();
  if (!data) return <div style={{color: 'var(--text-dim)'}}>Loading health data...</div>;

  const tunnelUrl = launcher?.ngrok?.url || data.config?.publicUrl || '';
  const toolCount = data.mcp?.toolNames?.length || data.mcp?.tools || 0;
  const sessions = data.mcp?.activeSessions || 0;
  const records = data.index?.records ?? data.index?.totalRecords ?? 0;
  const edges = data.index?.edges ?? 0;
  const clients = data.mcp?.clients || [];

  return (
    <div>
      <div className="stat-grid stat-grid-5">
        <StatCard label="MCP Tools" value={toolCount} sub="All healthy" />
        <StatCard label="Connected Clients" value={sessions} sub={sessions > 0 ? 'SSE transport' : 'No active sessions'} />
        <StatCard label="Index Records" value={records.toLocaleString()} sub="+0 today" />
        <StatCard label="API Calls/hr" value="—" sub="Estimated" />
        <StatCard label="Knowledge Edges" value={edges.toLocaleString()} />
      </div>

      <div className="stat-grid stat-grid-2">
        <div>
          <div className="section-title">Infrastructure</div>
          <div className="service-table">
            <ServiceRow dotStatus={data.checks?.postgres?.status} name="PostgreSQL" statusLabel={statusText(data.checks?.postgres?.status)} detail={data.checks?.postgres?.latency ? data.checks.postgres.latency + 'ms' : ''} port="5432" />
            <ServiceRow dotStatus={data.checks?.redis?.status} name="Redis" statusLabel={statusText(data.checks?.redis?.status)} detail={data.checks?.redis?.latency ? data.checks.redis.latency + 'ms' : ''} port="6379" />
            <ServiceRow dotStatus={data.checks?.clickhouse?.status} name="ClickHouse" statusLabel={statusText(data.checks?.clickhouse?.status)} detail={data.checks?.clickhouse?.status === 'fallback' ? 'In-memory mode' : ''} port="8123" />
            <ServiceRow dotStatus={data.checks?.s3?.status} name="MinIO/S3" statusLabel={statusText(data.checks?.s3?.status)} detail="" port="9090" />

// ─── Pipeline Tab ───
const SOURCE_LABELS = {
  local: 'Local Files',
  upload: 'Uploads',
  gws: 'Google Workspace',
  chat_artifact: 'Chat Artifacts',
};

function PipelineTab({ data }) {
  const records = data?.index?.records ?? data?.index?.totalRecords ?? 0;
  const rawFiles = data?.index?.rawFiles ?? data?.index?.rawFileCount ?? 0;
  const edges = data?.index?.edges ?? 0;

  // Pull canonical 7-stage architecture from /api/models/pipeline. Each stage
  // carries: stageName, role (or null), produces, storage, llm flag, and
  // usageThisMonth (call count merged from the tier(s) the stage routes through).
  const [pipeline, setPipeline] = useState([]);
  useEffect(() => {
    let mounted = true;
    const load = async () => {
      try {
        const res = await fetch('http://localhost:3001/api/models/pipeline');
        const json = await res.json();
        if (mounted && !json.error) setPipeline(json.data || []);
      } catch { /* leave empty; UI shows fallback */ }
    };
    load();
    const id = setInterval(load, 10000);
    return () => { mounted = false; clearInterval(id); };
  }, []);

  // Real source breakdown from /api/health (raw_files grouped by source_type)
  const breakdown = data?.index?.sourceBreakdown ?? [];
  const breakdownTotal = breakdown.reduce((sum, s) => sum + (s.count || 0), 0) || 0;
  const sources = breakdown.map(s => ({
    label: SOURCE_LABELS[s.source] || s.source,
    count: s.count,
    pct: breakdownTotal > 0 ? Math.round((s.count / breakdownTotal) * 100) : 0,
  }));

  // Per-stage tile color/label reflects what's actually happening:
  //   - LLM stages: # of calls this month (green if > 0, dim if 0)
  //   - Non-LLM stages: storage table size (raw files, records, edges)
  //   - llm='partial' stages still show their LLM call count when > 0
  const stageStatus = (s) => {
    if (s.llm === 'no' || !s.role) {
      // Map to the closest health metric for non-LLM stages
      if (s.stageName === 'Ingest')   return { count: rawFiles, unit: 'raw files' };
      if (s.stageName === 'Activate') return { count: 0,        unit: 'session buffer' };
      if (s.stageName === 'Relate')   return { count: edges,    unit: 'edges' };
      if (s.stageName === 'Attribute')return { count: edges,    unit: 'weighted' };
      return { count: records, unit: 'records' };
    }
    return { count: s.usageThisMonth?.calls ?? 0, unit: 'LLM calls/mo' };
  };

  return (
    <div>
      <div className="section-title">Pipeline Stages</div>
      <div className="pipeline-flow" style={{flexWrap:'wrap'}}>
        {pipeline.length === 0 && (
          <div style={{fontSize:11, color:'var(--text-dim)', padding:8}}>Loading pipeline…</div>
        )}
        {pipeline.map((s, i) => {
          const { count, unit } = stageStatus(s);
          const isLlm = s.llm !== 'no';
          const ok = count > 0;
          const color = !isLlm ? '#fff'
                      : s.llm === 'partial' ? 'var(--amber)'
                      : ok ? 'var(--green)' : 'var(--text-dim)';
          const llmDot = s.llm === 'yes' ? '● '
                       : s.llm === 'partial' ? '◐ '
                       : '○ ';
          return (
            <React.Fragment key={s.stage}>
              <div className="pipeline-stage" title={s.summary}>
                <div style={{fontSize:9, color:'var(--text-dim)', fontFamily:'var(--font-mono)'}}>
                  {String(s.stage).padStart(2,'0')}
                </div>
                <div className="stage-name">{s.stageName}</div>
                {s.role && (
                  <div style={{fontSize:10, color:'var(--accent)', fontFamily:'var(--font-mono)', marginTop:2}}>
                    {llmDot}{s.role} → {s.produces}
                  </div>
                )}
                {!s.role && (
                  <div style={{fontSize:10, color:'var(--text-dim)', fontFamily:'var(--font-mono)', marginTop:2}}>
                    {llmDot}{s.produces}
                  </div>
                )}
                <div className="stage-status" style={{color, marginTop:4}}>
                  {count.toLocaleString()} {unit}
                </div>
                <div style={{fontSize:9, color:'var(--text-dim)', marginTop:4}}>{s.storage}</div>
              </div>
              {i < pipeline.length - 1 && <span className="pipeline-arrow">→</span>}
            </React.Fragment>
          );
        })}
      </div>

      <div className="stat-grid stat-grid-4">
        <StatCard label="Index Records" value={records.toLocaleString()} />
        <StatCard label="Raw Files" value={rawFiles.toLocaleString()} />
        <StatCard label="Embeddings" value={(records * 3).toLocaleString()} sub="3 facets × records" />
        <StatCard label="Knowledge Edges" value={edges.toLocaleString()} />
      </div>

      <div className="section-title">Source Breakdown</div>
      <div className="stat-card" style={{padding: '16px 20px'}}>
        {sources.length === 0 && (
          <div style={{color: 'var(--text-dim)', fontSize: 12, padding: 8}}>
            No raw files ingested yet.
          </div>
        )}
        {sources.map(src => (
          <div className="bar-row" key={src.label}>
            <span className="bar-label">{src.label}</span>
            <div className="bar-track"><div className="bar-fill" style={{width: src.pct + '%'}} /></div>
            <span className="bar-count">{src.count}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const USER_COLORS = ['#6C63FF', '#10a37f', '#22d3ee', '#f59e0b', '#ec4899', '#84cc16', '#a855f7'];

function initialsFor(name, email) {
  const src = (name || email || '?').trim();
  const parts = src.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return src.slice(0, 2).toUpperCase();
}
function colorFor(id) {
  let h = 0;
  for (let i = 0; i < (id || '').length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return USER_COLORS[h % USER_COLORS.length];
}
function formatTokens(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return String(n);
}
function formatUsd(n) {
  return '$' + (Number(n) || 0).toFixed(2);
}

// ─── System Tab ───
function SystemTab({ data }) {
  // Real costs from /api/health (WIRE-1)
  const costsToday = data?.costs?.today ?? 0;
  const costsMonth = data?.costs?.thisMonth ?? 0;
  const byModel = data?.costs?.byModel ?? [];

  // Monthly projection: today's cost × days-in-month, scaled by hours elapsed today
  const now = new Date();
  const hoursElapsedToday = now.getHours() + now.getMinutes() / 60 || 1;
  const projection = hoursElapsedToday > 0
    ? (costsToday / hoursElapsedToday) * 24 * 30
    : 0;

  // Compute max cost for bar scaling
  const maxCost = byModel.reduce((m, row) => Math.max(m, row.cost || 0), 0) || 1;
  const formatUsd = (n) => '$' + (Number(n) || 0).toFixed(2);

  const resources = [
    { name: 'PostgreSQL', status: data?.checks?.postgres?.status || 'ok', cpu: 12, mem: 34, extra: 'connections: 8' },
    { name: 'Redis', status: data?.checks?.redis?.status || 'ok', cpu: 3, mem: 15, extra: 'keys: 142' },
    { name: 'ClickHouse', status: data?.checks?.clickhouse?.status || 'fallback', cpu: 8, mem: 28, extra: 'queries/hr: 45' },
    { name: 'MinIO', status: data?.checks?.s3?.status || 'ok', cpu: 5, mem: 20, extra: 'objects: 89' },
  ];

  return (
    <div>
      <div className="stat-grid stat-grid-4">
        <StatCard label="Today's Cost" value={formatUsd(costsToday)} sub={byModel.length + ' models'} />
        <StatCard label="Monthly Projection" value={formatUsd(projection)} sub="Based on today's rate" />
        <StatCard label="This Month" value={formatUsd(costsMonth)} sub="Actual so far" />
        <StatCard label="Total Calls" value={byModel.reduce((s, m) => s + (m.calls || 0), 0)} />
      </div>

      <div className="section-title">LLM Cost by Model</div>
      <div className="stat-card" style={{padding: '16px 20px', marginBottom: 24}} data-testid="cost-by-model">
        {byModel.length === 0 ? (
          <div style={{color: 'var(--text-dim)', fontSize: 11, padding: '8px 0'}}>No LLM usage recorded yet</div>
        ) : byModel.map(m => (
          <div className="bar-row" key={m.model}>
            <span className="bar-label cost-bar-label" style={{width: 170}}>{m.model}</span>
            <div className="bar-track"><div className="bar-fill" style={{width: ((m.cost / maxCost) * 100) + '%'}} /></div>
            <span className="bar-count">{formatUsd(m.cost)}</span>
          </div>
        ))}
      </div>

      <div className="section-title">Infrastructure Resources</div>
      <div className="stat-grid stat-grid-4">
        {resources.map(r => (
          <div className="resource-card" key={r.name}>
            <div className="res-header">
              <span className={dotClass(r.status)} />
              <span className="res-name">{r.name}</span>
            </div>
            <div className="res-bar-row">
              <span className="res-bar-label">CPU</span>
              <div className="res-bar-track"><div className="res-bar-fill" style={{width: r.cpu+'%', background: 'var(--accent)'}} /></div>
              <span className="res-bar-value">{r.cpu}%</span>
            </div>
            <div className="res-bar-row">
              <span className="res-bar-label">Mem</span>
              <div className="res-bar-track"><div className="res-bar-fill" style={{width: r.mem+'%', background: 'var(--cyan)'}} /></div>
              <span className="res-bar-value">{r.mem}%</span>
            </div>
            <div style={{fontFamily: 'var(--font-mono)', fontSize: 9, color: 'var(--text-dim)', marginTop: 6}}>{r.extra}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Traffic Tab ───
function TrafficTab() {
  const [requests, setRequests] = useState([]);
  const wsRef = useRef(null);

  useEffect(() => {
    try {
      const ws = new WebSocket('ws://localhost:4000/ws');
      wsRef.current = ws;
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'traffic') {
            setRequests(prev => [msg, ...prev].slice(0, 100));
          }
        } catch {}
      };
      ws.onerror = () => {};
      ws.onclose = () => {};
      return () => ws.close();
    } catch {}
  }, []);

  const methodColor = (m) => m === 'POST' ? 'var(--cyan)' : m === 'GET' ? 'var(--green)' : 'var(--text)';
  const statusColor = (s) => s < 300 ? 'var(--green)' : 'var(--red)';
  const latencyColor = (ms) => ms > 500 ? 'var(--amber)' : 'var(--text-dim)';

  return (
    <div>
      <div className="section-title">Live API Traffic</div>
      <div className="service-table">
        <table className="traffic-table">
          <thead>
            <tr><th>Time</th><th>Method</th><th>Path</th><th>Tool</th><th>Status</th><th>Latency</th><th>Client</th></tr>
          </thead>
          <tbody>
            {requests.length === 0 ? (
              <tr><td colSpan="7" style={{color: 'var(--text-dim)', textAlign: 'center', padding: 24}}>Waiting for requests... (WebSocket on ws://localhost:4000/ws)</td></tr>
            ) : requests.map((r, i) => (
              <tr key={i}>
                <td>{r.time}</td>
                <td style={{color: methodColor(r.method)}}>{r.method}</td>
                <td>{r.path}</td>
                <td style={{color: 'var(--accent)'}}>{r.tool || '—'}</td>
                <td style={{color: statusColor(r.status)}}>{r.status}</td>
                <td style={{color: latencyColor(r.ms)}}>{r.ms}ms</td>
                <td>{r.client || '—'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── Logs Tab ───
function LogsTab() {
  const [activeSource, setActiveSource] = useState('api');
  const [logs, setLogs] = useState({ api: [], agent: [], ngrok: [] });
  const viewerRef = useRef(null);
  const wsRef = useRef(null);

  useEffect(() => {
    try {
      const ws = new WebSocket('ws://localhost:4000/ws');
      wsRef.current = ws;
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'log') {
            setLogs(prev => ({
              ...prev,
              [msg.source]: [...(prev[msg.source] || []), msg.line].slice(-500),
            }));
          }
        } catch {}
      };
      return () => ws.close();
    } catch {}
  }, []);

  useEffect(() => {
    if (viewerRef.current) {
      const el = viewerRef.current;
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
      if (atBottom) el.scrollTop = el.scrollHeight;
    }
  }, [logs, activeSource]);

  const lineClass = (line) => {
    if (/error|ERR|500|404|fail/i.test(line)) return 'log-line-error';
    if (/warn|WARN/i.test(line)) return 'log-line-warn';
    if (/200|201|✓|success/i.test(line)) return 'log-line-success';
    return '';
  };

  const currentLogs = logs[activeSource] || [];

  return (
    <div>
      <div className="sub-tabs">
        {['api', 'agent', 'ngrok'].map(s => (
          <button key={s} className={'sub-tab' + (activeSource === s ? ' active' : '')} onClick={() => setActiveSource(s)}>
            {s === 'api' ? 'API Server' : s === 'agent' ? 'Desktop Agent' : 'ngrok'}
          </button>
        ))}
      </div>
      <div className="log-viewer" ref={viewerRef}>
        {currentLogs.length === 0 ? (
          <div style={{padding: 12}}>Waiting for log data... (WebSocket on ws://localhost:4000/ws)</div>
        ) : currentLogs.map((line, i) => (
          <div key={i} className={lineClass(line)}>{line}</div>
        ))}
      </div>
    </div>
  );
}

// ─── Dashboard token (injected by launcher into the HTML) ───
function getDashboardToken() {
  const el = document.querySelector('meta[name="dashboard-token"]');
  return (el && el.getAttribute('content')) || '';
}
function authedFetch(url, init) {
  const opts = init || {};
  const headers = Object.assign({}, opts.headers || {}, { 'X-Dashboard-Token': getDashboardToken() });
  return fetch(url, Object.assign({}, opts, { headers }));
}

// ─── Format helpers for new tabs ───
function formatEta(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return '<1s';
  const s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  const rs = s % 60;
  if (m < 60) return m + 'm ' + rs + 's';
  const h = Math.floor(m / 60);
  const rm = m % 60;
  return h + 'h ' + rm + 'm';
}
function formatCost(n) { return '$' + (Number(n) || 0).toFixed(4); }
function formatCostShort(n) {
  const v = Number(n) || 0;
  if (v >= 1) return '$' + v.toFixed(2);
  if (v >= 0.01) return '$' + v.toFixed(3);
  return '$' + v.toFixed(5);
}

// ─── Pipeline LLM Roles section (renders inside ModelsTab) ───
function PipelineRolesSection({ openPrompts, togglePrompt }) {
  const [stages, setStages] = useState([]);
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    try {
      const res = await fetch('http://localhost:3001/api/models/pipeline');
      // Read as text first so that on parse failure we can show the actual
      // body (a 404 page, an HTML error, or whatever the API is returning).
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        const head = text.slice(0, 240).replace(/\s+/g, ' ').trim();
        throw new Error(
          'Pipeline endpoint returned non-JSON (status ' + res.status + '). ' +
          'Body starts with: ' + (head || '(empty)') +
          ' — most likely the API needs to be restarted to pick up /api/models/pipeline.'
        );
      }
      if (json.error) { setError(json.error.message); return; }
      setStages(json.data || []);
      setError(null);
    } catch (e) { setError(e.message); }
  }, []);
  useEffect(() => {
    load();
    const id = setInterval(load, 10000);
    return () => clearInterval(id);
  }, [load]);

  // Only the 5 LLM roles get prominent treatment. Non-LLM stages get a
  // compact strip below so the operator can still see the full pipeline.
  const llmStages = stages.filter(s => s.role && s.llm !== 'no');
  const nonLlmStages = stages.filter(s => !s.role || s.llm === 'no');

  const llmBadge = (llm) => {
    if (llm === 'yes') return <span style={{fontSize:9, color:'var(--green)', fontFamily:'var(--font-mono)'}}>● LLM</span>;
    if (llm === 'partial') return <span style={{fontSize:9, color:'var(--amber)', fontFamily:'var(--font-mono)'}}>◐ PARTIAL</span>;
    return <span style={{fontSize:9, color:'var(--text-dim)', fontFamily:'var(--font-mono)'}}>○ NO LLM</span>;
  };

  return (
    <div style={{marginBottom: 28}}>
      <div className="section-title" style={{marginBottom: 8}}>
        Pipeline LLM Roles ({llmStages.length})
      </div>
      <div style={{fontSize:11, color:'var(--text-dim)', marginBottom:12}}>
        The cognitive pipeline runs 7 stages. Stages 1–2 are passive buffers.
        Stages 3–7 each have a named LLM role: <span style={{color:'var(--accent)'}}>Reporter → Analyst → Editor → Archivist → Profiler</span>.
      </div>
      {error && <div className="error-banner"><span className="dot dot-red" /> {error}</div>}

      {llmStages.map((s) => {
        const open = !!openPrompts['ROLE:' + s.role];
        const accent = s.llm === 'yes' ? 'var(--green)' : 'var(--amber)';
        return (
          <div key={s.role} className="stat-card" style={{padding: 0, marginBottom: 10, overflow:'hidden'}}>
            <div style={{display:'flex', alignItems:'center', gap:14, padding:'14px 16px', cursor:'pointer'}}
                 onClick={() => togglePrompt('ROLE:' + s.role)}>
              <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text-dim)', width:24}}>
                {String(s.stage).padStart(2, '0')}
              </div>
              <div style={{flex:1}}>
                <div style={{display:'flex', alignItems:'baseline', gap:10}}>
                  <span style={{fontSize:14, fontWeight:600, color:'#fff'}}>{s.role}</span>
                  <span style={{fontSize:11, color:'var(--text-dim)'}}>· {s.stageName} → {s.produces}</span>
                  {llmBadge(s.llm)}
                </div>
                <div style={{fontSize:11, color:'var(--text-dim)', marginTop:4, maxWidth:680}}>{s.summary}</div>
                <div style={{fontSize:10, color:'var(--text-dim)', marginTop:4, fontFamily:'var(--font-mono)'}}>
                  storage: {s.storage}
                  {s.tiers.length > 0 && <> · tier: {s.tiers.join(', ')}</>}
                  {s.prompts.length > 0 && <> · {s.prompts.length} prompt{s.prompts.length === 1 ? '' : 's'}</>}
                </div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:14, fontWeight:600, color: s.usageThisMonth.calls > 0 ? 'var(--green)' : 'var(--text-dim)'}}>
                  {s.usageThisMonth.calls.toLocaleString()}
                </div>
                <div style={{fontSize:9, color:'var(--text-dim)', fontFamily:'var(--font-mono)'}}>calls / mo</div>
              </div>
              <div style={{fontSize:14, color:'var(--text-dim)', marginLeft:8, width:14}}>
                {open ? '▾' : '▸'}
              </div>
            </div>
            {open && (
              <div style={{padding:'4px 16px 16px 54px', borderTop:'1px solid var(--border)', borderLeft:'2px solid ' + accent}}>
                {s.prompts.length === 0 && (
                  <div style={{fontSize:11, color:'var(--text-dim)', padding:'12px 0'}}>
                    No prompt registered for this role yet — the stage runs deterministically (see implementations below).
                  </div>
                )}
                {s.prompts.map((p, i) => (
                  <div key={i} style={{marginTop:12}}>
                    <div style={{display:'flex', alignItems:'baseline', gap:8, marginBottom:6}}>
                      <span style={{fontSize:11, fontWeight:600, color:'#fff'}}>{p.label}</span>
                      <span style={{fontSize:10, color:'var(--text-dim)', fontFamily:'var(--font-mono)'}}>{p.source}</span>
                      <span style={{fontSize:9, color:'var(--accent)', fontFamily:'var(--font-mono)'}}>tier: {p.tier}</span>
                    </div>
                    <pre style={{
                      margin:0, padding:'10px 12px', background:'var(--bg)', border:'1px solid var(--border)',
                      borderRadius:4, fontSize:10, fontFamily:'var(--font-mono)', color:'var(--text)',
                      whiteSpace:'pre-wrap', wordBreak:'break-word', maxHeight:400, overflow:'auto'
                    }}>{p.prompt}</pre>
                  </div>
                ))}
                {s.implementations.length > 0 && (
                  <div style={{marginTop:14, paddingTop:10, borderTop:'1px dashed var(--border)'}}>
                    <div style={{fontSize:10, color:'var(--text-dim)', marginBottom:4}}>Implemented by:</div>
                    {s.implementations.map((f, i) => (
                      <div key={i} style={{fontSize:10, color:'var(--text-dim)', fontFamily:'var(--font-mono)', paddingLeft:8}}>
                        · {f}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}

      {nonLlmStages.length > 0 && (
        <div style={{marginTop:14}}>
          <div style={{fontSize:10, color:'var(--text-dim)', textTransform:'uppercase', letterSpacing:1.2, marginBottom:6}}>
            Non-LLM stages
          </div>
          <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
            {nonLlmStages.map(s => (
              <div key={s.stage} className="stat-card" style={{padding:'10px 14px', flex:'1 1 220px', minWidth:0}}>
                <div style={{fontSize:9, color:'var(--text-dim)', fontFamily:'var(--font-mono)'}}>
                  {String(s.stage).padStart(2,'0')} · {s.stageName}
                </div>
                <div style={{fontSize:12, fontWeight:600, color:'#fff', marginTop:2}}>{s.produces}</div>
                <div style={{fontSize:10, color:'var(--text-dim)', marginTop:4, fontFamily:'var(--font-mono)'}}>{s.storage}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Models Tab ───
function ModelsTab() {
  const [tiers, setTiers] = useState([]);
  const [catalogue, setCatalogue] = useState([]);
  const [draft, setDraft] = useState({}); // tier → candidate model id
  const [saving, setSaving] = useState(false);
  const [status, setStatus] = useState(null);
  const [search, setSearch] = useState('');
  const [onlyFree, setOnlyFree] = useState(false);
  const [showIdle, setShowIdle] = useState(false);
  const [showInactive, setShowInactive] = useState(false);
  const [showTierView, setShowTierView] = useState(false);
  // tier → boolean: is its system-prompt panel expanded?
  const [openPrompts, setOpenPrompts] = useState({});
  const togglePrompt = (key) => setOpenPrompts(p => Object.assign({}, p, { [key]: !p[key] }));

  const loadTiers = useCallback(async () => {
    try {
      const res = await fetch('http://localhost:3001/api/models');
      const json = await res.json();
      setTiers(json.data || []);
    } catch { setStatus({ err: 'Failed to load tiers' }); }
  }, []);

  useEffect(() => {
    loadTiers();
    const id = setInterval(loadTiers, 10000);
    return () => clearInterval(id);
  }, [loadTiers]);

  useEffect(() => {
    (async () => {
      try {
        const params = new URLSearchParams();
        if (onlyFree) params.set('free', '1');
        const res = await fetch('http://localhost:3001/api/openrouter/models?' + params.toString());
        const json = await res.json();
        setCatalogue(json.data || []);
      } catch {
        setCatalogue([]);
      }
    })();
  }, [onlyFree]);

  const dirty = Object.keys(draft).length > 0;

  const filteredCatalogue = React.useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return catalogue;
    return catalogue.filter(m => m.id.toLowerCase().includes(q) || (m.name||'').toLowerCase().includes(q));
  }, [catalogue, search]);

  const save = async () => {
    setSaving(true);
    try {
      // Merge draft with current overrides — keep explicit overrides that aren't being changed
      const current = {};
      for (const t of tiers) if (t.isOverridden) current[t.tier] = t.currentModel;
      const next = Object.assign({}, current, draft);
      const res = await authedFetch('http://localhost:3001/api/models/overrides', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(next),
      });
      if (!res.ok) { const t = await res.text(); throw new Error(t); }
      setStatus({ ok: 'Saved ' + Object.keys(next).length + ' override(s)' });
      setDraft({});
      await loadTiers();
    } catch (e) {
      setStatus({ err: 'Save failed: ' + e.message });
    } finally { setSaving(false); }
  };

  const resetTier = async (tier) => {
    setSaving(true);
    try {
      await authedFetch('http://localhost:3001/api/models/reset/' + tier, { method: 'POST' });
      setDraft(d => { const n = Object.assign({}, d); delete n[tier]; return n; });
      await loadTiers();
    } finally { setSaving(false); }
  };

  const resetAll = async () => {
    if (!confirm('Reset all tier overrides to defaults?')) return;
    setSaving(true);
    try {
      await authedFetch('http://localhost:3001/api/models/reset-all', { method: 'POST' });
      setDraft({});
      await loadTiers();
    } finally { setSaving(false); }
  };

  return (
    <div>
      {/* The 5 LLM roles that drive the indexing pipeline — front and center */}
      <PipelineRolesSection openPrompts={openPrompts} togglePrompt={togglePrompt} />

      <div style={{marginTop: 24, marginBottom: 8}}>
        <button className="ghost-btn" onClick={() => setShowTierView(v => !v)}
          style={{width: '100%', textAlign: 'left', padding: '8px 12px'}}>
          {showTierView ? '▾' : '▸'} Tier-level model assignments — advanced (per-call-site model overrides)
        </button>
      </div>

      {showTierView && (
      <div>
      <div className="section-title">Model catalogue filter</div>
      <div style={{display: 'flex', gap: 10, marginBottom: 16, alignItems: 'center'}}>
        <input type="text" placeholder="Search models (e.g. 'claude', 'haiku', 'deepseek')"
          value={search} onChange={e => setSearch(e.target.value)}
          style={{flex: 1, padding: '8px 12px', background: 'var(--bg)', border: '1px solid var(--border)',
                  color: 'var(--text)', borderRadius: 4, fontSize: 12, fontFamily: 'var(--font-mono)'}} />
        <label style={{fontSize: 11, color: 'var(--text-dim)', display: 'flex', alignItems: 'center', gap: 6}}>
          <input type="checkbox" checked={onlyFree} onChange={e => setOnlyFree(e.target.checked)} />
          Free only
        </label>
        <span className="job-meta">{filteredCatalogue.length} / {catalogue.length} models</span>
      </div>

      {dirty && (
        <div className="save-bar">
          <span style={{flex: 1}}>{Object.keys(draft).length} unsaved change(s)</span>
          <button className="ghost-btn" onClick={() => setDraft({})}>Discard</button>
          <button className="primary-btn" onClick={save} disabled={saving}>
            {saving ? 'Saving…' : 'Save overrides'}
          </button>
        </div>
      )}
      {status?.ok && <div style={{color: 'var(--green)', fontSize: 11, marginBottom: 12, fontFamily: 'var(--font-mono)'}}>{status.ok}</div>}
      {status?.err && <div className="error-banner"><span className="dot dot-red" /> {status.err}</div>}

      {(() => {
        // Bucket tiers by what's actually happening, not by config flags:
        //   - usedTiers      → calls > 0 this month (the only ones doing work)
        //   - idleActive     → wired into live code paths but never called yet
        //   - inactiveTiers  → kept around for back-compat, no live caller
        const usedTiers = tiers.filter(t => (t.usageThisMonth?.calls ?? 0) > 0);
        const idleActive = tiers.filter(t => t.active && (t.usageThisMonth?.calls ?? 0) === 0);
        const inactiveTiers = tiers.filter(t => !t.active);

        const renderRow = (t) => {
          const current = draft[t.tier] !== undefined ? draft[t.tier] : t.currentModel;
          const isDirty = draft[t.tier] !== undefined && draft[t.tier] !== t.currentModel;
          const variants = t.promptVariants || [];
          const hasPrompt = variants.length > 0;
          const open = !!openPrompts[t.tier];
          return (
            <React.Fragment key={t.tier}>
              <div className="tier-row">
                <div>
                  <div className="tier-name" style={{cursor: hasPrompt ? 'pointer' : 'default'}}
                       onClick={() => hasPrompt && togglePrompt(t.tier)}
                       title={hasPrompt ? 'Click to view system prompt' : ''}>
                    {hasPrompt ? (open ? '▾ ' : '▸ ') : ''}
                    {t.tier}
                  </div>
                  <div className="tier-default">default: {t.defaultModel}</div>
                  {t.promptPurpose && (
                    <div style={{fontSize: 10, color: 'var(--text-dim)', marginTop: 2, maxWidth: 280}}>
                      {t.promptPurpose}
                    </div>
                  )}
                </div>
                <select className="tier-selector" value={current}
                  onChange={e => setDraft(d => Object.assign({}, d, { [t.tier]: e.target.value }))}>
                  {filteredCatalogue.find(m => m.id === current) ? null : (
                    <option value={current}>{current} (current)</option>
                  )}
                  {filteredCatalogue.map(m => (
                    <option key={m.id} value={m.id}>
                      {m.id}
                      {m.pricing.prompt === 0 && m.pricing.completion === 0 ? ' — free'
                        : ' — $' + m.pricing.prompt.toFixed(3) + '/$' + m.pricing.completion.toFixed(3) + ' per 1M'}
                    </option>
                  ))}
                </select>
                <div className="tier-usage">
                  <div style={{color: (t.usageThisMonth?.calls ?? 0) > 0 ? 'var(--green)' : 'var(--text-dim)'}}>
                    {t.usageThisMonth.calls} calls
                  </div>
                  <div>{formatCostShort(t.usageThisMonth.cost)}</div>
                </div>
                <div>
                  {(t.isOverridden || isDirty) && <span className="overridden-pill">OVERRIDE</span>}
                  {isDirty && <span className="overridden-pill" style={{marginLeft: 4, background: 'rgba(251,191,36,0.15)', color: 'var(--amber)'}}>DIRTY</span>}
                </div>
                <div style={{textAlign: 'right', display:'flex', gap:6, justifyContent:'flex-end'}}>
                  {hasPrompt && (
                    <button className="ghost-btn" onClick={() => togglePrompt(t.tier)}>
                      {open ? 'Hide prompt' : 'Show prompt'}
                    </button>
                  )}
                  {t.isOverridden && (
                    <button className="ghost-btn" onClick={() => resetTier(t.tier)} disabled={saving}>Reset</button>
                  )}
                </div>
              </div>
              {open && hasPrompt && (
                <div style={{padding:'12px 16px 16px 32px', background:'rgba(108,99,255,0.04)', borderLeft:'2px solid var(--accent)'}}>
                  {variants.map((v, i) => (
                    <div key={i} style={{marginBottom: i < variants.length - 1 ? 16 : 0}}>
                      <div style={{display:'flex', alignItems:'baseline', gap:8, marginBottom:6}}>
                        <span style={{fontSize:11, fontWeight:600, color:'#fff'}}>{v.label}</span>
                        <span style={{fontSize:10, color:'var(--text-dim)', fontFamily:'var(--font-mono)'}}>{v.source}</span>
                      </div>
                      <pre style={{
                        margin:0, padding:'10px 12px', background:'var(--bg)', border:'1px solid var(--border)',
                        borderRadius:4, fontSize:10, fontFamily:'var(--font-mono)', color:'var(--text)',
                        whiteSpace:'pre-wrap', wordBreak:'break-word', maxHeight:400, overflow:'auto'
                      }}>{v.prompt}</pre>
                    </div>
                  ))}
                </div>
              )}
            </React.Fragment>
          );
        };

        return (
          <>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8}}>
              <div className="section-title" style={{marginBottom: 0}}>
                In use this month ({usedTiers.length})
              </div>
              <button className="ghost-btn" onClick={resetAll} disabled={saving}>Reset all to defaults</button>
            </div>
            {usedTiers.length === 0 ? (
              <div className="stat-card" style={{padding:'14px 16px', color:'var(--text-dim)', fontSize:12, marginBottom:12}}>
                No tier has been called yet this month. As soon as the app makes its first LLM call, the tier will appear here with its prompt.
              </div>
            ) : (
              <div className="service-table">{usedTiers.map(renderRow)}</div>
            )}

            <div style={{marginTop: 20, marginBottom: 8}}>
              <button className="ghost-btn" onClick={() => setShowIdle(v => !v)}
                style={{width: '100%', textAlign: 'left', padding: '8px 12px'}}>
                {showIdle ? '▾' : '▸'} Wired but idle ({idleActive.length}) — live code path, no call this month
              </button>
            </div>
            {showIdle && <div className="service-table">{idleActive.map(renderRow)}</div>}

            <div style={{marginTop: 16, marginBottom: 8}}>
              <button className="ghost-btn" onClick={() => setShowInactive(v => !v)}
                style={{width: '100%', textAlign: 'left', padding: '8px 12px'}}>
                {showInactive ? '▾' : '▸'} Unused tiers ({inactiveTiers.length}) — dormant config, no live caller
              </button>
            </div>
            {showInactive && <div className="service-table">{inactiveTiers.map(renderRow)}</div>}
          </>
        );
      })()}
      </div>
      )}
    </div>
  );
}

// ─── Usage Tab ───
function useUsageData(intervalMs) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(false);
  useEffect(() => {
    let mounted = true;
    const poll = async () => {
      try {
        const res = await fetch('http://localhost:3001/api/openrouter/usage');
        const json = await res.json();
        if (mounted) { setData(json.data); setError(false); }
      } catch { if (mounted) setError(true); }
    };
    poll();
    const id = setInterval(poll, intervalMs || 5000);
    return () => { mounted = false; clearInterval(id); };
  }, [intervalMs]);
  return { data, error };
}

function Sparkline({ series }) {
  if (!series || series.length === 0) {
    return <div style={{fontSize: 11, color: 'var(--text-dim)'}}>No activity in last 24h</div>;
  }
  const max = Math.max(...series.map(s => s.cost), 0.00001);
  return (
    <div className="sparkline">
      {series.map((s, i) => (
        <div key={i} className="spark-bar" title={s.hour + ': ' + formatCost(s.cost)}
             style={{height: Math.max((s.cost / max) * 100, 2) + '%'}} />
      ))}
    </div>
  );
}

            {(local.byTier || []).length === 0 ? (
              <div style={{color: 'var(--text-dim)', fontSize: 11}}>No usage recorded yet</div>
            ) : local.byTier.map(r => (
              <div className="bar-row" key={r.tier}>
                <span className="bar-label" style={{width: 140}}>{r.tier}</span>
